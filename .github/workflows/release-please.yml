name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Standard release type for Python projects
          release-type: python
          # Use the organization PAT when configured, otherwise the workflow token.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[ui,panel]"

      - name: Run Tests
        run: PYTHONPATH=. python -B -m unittest discover tests

      - name: Set release version
        run: |
          TAG_NAME="${{ needs.release-please.outputs.tag_name }}"
          VERSION=${TAG_NAME#v}

          python scripts/versioning.py validate "$VERSION"
          python scripts/versioning.py set "$VERSION"
          echo "ENTIGRAM_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  homebrew:
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Entigram release tooling
        uses: actions/checkout@v4
        with:
          path: entigram

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: Entigram-AI/homebrew-entigram
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-entigram

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update Homebrew Tap
        run: |
          TAG_NAME="${{ needs.release-please.outputs.tag_name }}"
          VERSION=${TAG_NAME#v}
          echo "Releasing version: $VERSION"
          cd homebrew-entigram
          FORMULA=$(find Formula -maxdepth 1 -type f -name '*.rb' | sort | head -n 1)
          if [ -z "$FORMULA" ]; then
            echo "No Entigram formula found under Formula/."
            find Formula -maxdepth 2 -type f -name '*.rb' | sort
            exit 1
          fi
          echo "Updating formula: $FORMULA"
          python ../entigram/scripts/update_homebrew_formula.py --package-name entigram-ai --version "$VERSION" "$FORMULA"
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- "$FORMULA"; then
            echo "Homebrew formula already up to date."
            exit 0
          fi
          git add "$FORMULA"
          git commit -m "chore: bump etg to ${VERSION}"
          git push origin main
