name: CI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test-python:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[panel]"

      - name: Run test suite
        run: PYTHONPATH=. python -B -m unittest discover tests

  test:
    name: test
    needs: test-python
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Confirm Python test matrix passed
        if: ${{ needs.test-python.result == 'success' }}
        run: echo "All supported Python versions passed."

      - name: Fail when Python test matrix did not pass
        if: ${{ needs.test-python.result != 'success' }}
        run: exit 1

  test-node-client:
    name: test Node client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Node client tests
        run: npm test
