name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump_override:
        description: "SemVer bump override (auto, patch, minor, major)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run (do not commit, tag, or publish)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-orchestrator:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Plan release
        id: plan
        env:
          BUMP_OVERRIDE: ${{ github.event.inputs.bump_override || 'auto' }}
        run: |
          python scripts/release_orchestrator.py \
            --plan \
            --bump "$BUMP_OVERRIDE" \
            --set-github-output \
            --notes-file /tmp/release_notes.md
          echo "=== Release Notes Preview ==="
          cat /tmp/release_notes.md || true

      - name: Apply version bump and cut release
        id: release
        if: ${{ steps.plan.outputs.release_needed == 'true' && (github.event.inputs.dry_run != 'true') }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          BUMP_TYPE: ${{ steps.plan.outputs.bump_type }}
          NEXT_VERSION: ${{ steps.plan.outputs.next_version }}
          TAG_NAME: ${{ steps.plan.outputs.tag_name }}
        run: |
          echo "Cutting release $TAG_NAME ($BUMP_TYPE)..."
          python scripts/release_orchestrator.py \
            --apply \
            --bump "$BUMP_TYPE" \
            --notes-file /tmp/release_notes.md

          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add pyproject.toml CHANGELOG.md .release-please-manifest.json
          if [ -f server.json ]; then
            git add server.json
          fi

          git commit -m "chore: release $TAG_NAME [skip ci]"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"

          git push origin main
          git push origin "$TAG_NAME"

          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes-file /tmp/release_notes.md

          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

  publish:
    needs: release-orchestrator
    if: ${{ needs.release-orchestrator.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[panel]"

      - name: Run Tests
        run: PYTHONPATH=. python -B -m unittest discover tests

      - name: Set release version
        run: |
          TAG_NAME="${{ needs.release-orchestrator.outputs.tag_name }}"
          VERSION=${TAG_NAME#v}

          python scripts/versioning.py validate "$VERSION"
          python scripts/versioning.py set "$VERSION"
          echo "ENTIGRAM_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Set up Node for npm publication
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org

      - name: Publish Node client to npm
        working-directory: packages/client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TAG_NAME="${{ needs.release-orchestrator.outputs.tag_name }}"
          VERSION=${TAG_NAME#v}
          npm pack --dry-run
          npm version "$VERSION" --no-git-tag-version
          npm publish --access public

  homebrew:
    needs: [release-orchestrator, publish]
    if: ${{ needs.release-orchestrator.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Entigram release tooling
        uses: actions/checkout@v4
        with:
          path: entigram

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: Entigram-AI/homebrew-entigram
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-entigram

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update Homebrew Tap
        run: |
          TAG_NAME="${{ needs.release-orchestrator.outputs.tag_name }}"
          VERSION=${TAG_NAME#v}
          echo "Releasing version: $VERSION"
          cd homebrew-entigram
          FORMULA=$(find Formula -maxdepth 1 -type f -name '*.rb' | sort | head -n 1)
          if [ -z "$FORMULA" ]; then
            echo "No Entigram formula found under Formula/."
            find Formula -maxdepth 2 -type f -name '*.rb' | sort
            exit 1
          fi
          echo "Updating formula: $FORMULA"
          python ../entigram/scripts/update_homebrew_formula.py --package-name entigram-ai --version "$VERSION" "$FORMULA"
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- "$FORMULA"; then
            echo "Homebrew formula already up to date."
            exit 0
          fi
          git add "$FORMULA"
          git commit -m "chore: bump etg to ${VERSION}"
          git push origin main
