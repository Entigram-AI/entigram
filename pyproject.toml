[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "entigram-ai"
version = "2.5.0"
description = "Schema-first semantic governance layer for enterprise agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Entigram Authors" }
]
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0.1",
    "networkx>=3.0",
    "inflect>=7.0.0,<7.3.0",
    "protobuf>=5.28.2",
    "requests>=2.32.2",
    "mcp>=2.0.0,<3",
    "cryptography>=42.0.4"
]

[project.optional-dependencies]
panel = [
    "websockets>=13.0",
    "aiohttp>=3.10.11",
]
cozo = [
    "pycozo>=0.7.0",
]

[project.urls]
Homepage = "https://entigram.ai"
Source = "https://github.com/Entigram-AI/entigram"
Documentation = "https://entigram.ai"
Tracker = "https://github.com/Entigram-AI/entigram/issues"

[project.scripts]
etg = "entigram.cli_runner.etg_cli:main"
hydrate = "entigram.cli_runner.etg_cli:main"

[tool.setuptools]
include-package-data = false
packages = [
    "entigram", 
    "entigram.cli_runner", 
    "entigram.governance", 
    "entigram.schema_compiler", 
    "entigram.ontology_compiler", 
    "entigram.sensing", 
    "entigram.sqlite_ledger", 
    "entigram.templates"
]

[tool.setuptools.package-data]
entigram = [
    "templates/**/*.lds",
    "templates/**/*.ttl",
    "templates/**/*.md",
    "templates/**/*.py",
    "templates/**/.gitignore",
]
